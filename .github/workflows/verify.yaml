name: Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  console-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install locked browser test dependencies
        run: |
          npm ci --prefix console --ignore-scripts --no-fund --no-audit
          ./console/node_modules/.bin/playwright install --with-deps chromium
      - name: Test client resource, identity and schema contracts
        run: npm --prefix console test
      - name: Test actual browser workflows against explicit synthetic fixtures
        run: npm --prefix console run test:browser
      - name: Verify the recorded-run explorer in a real browser
        run: npm --prefix console run test:showcase
      - name: Collect browser reports and fixture screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: console-browser
          path: data/console-browser/
          if-no-files-found: warn
  contracts-and-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check formatting and compiler warnings
        run: |
          python3 scripts/format-java.py
          ./scripts/verify-core.sh
          python3 -m py_compile scripts/*.py
          for source in scripts/*.sh; do bash -n "$source"; done
      - name: Test readiness retry contracts
        run: python3 scripts/test-wait-ready.py
      - name: Test load and reconciliation contracts
        run: python3 scripts/test-load.py
      - name: Resolve isolated real Schema Registry runtime
        run: ./mvnw --batch-mode --no-transfer-progress -f tools/schema-registry-runtime/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.9.0:build-classpath -Dmdep.outputFile=target/classpath.txt
      - name: Test real HTTP, crash recovery, Kafka, registry and PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress -Pintegration verify
      - name: Validate Compose configuration
        env:
          DATABASE_PASSWORD: ci-synthetic-password
          DEMO_JWT_SECRET: ci-only-demo-key-at-least-thirty-two-bytes
        run: docker compose config --quiet
      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: java-verification
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: error
  deployment-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install checksum-verified deployment tools
        run: |
          python3 scripts/install-tools.py --directory "$RUNNER_TEMP/telemetry-tools" helm kubeconform terraform
          echo "$RUNNER_TEMP/telemetry-tools" >> "$GITHUB_PATH"
      - name: Validate Helm and Kubernetes API contracts
        run: |
          helm lint deploy/helm/telemetry -f deploy/helm/telemetry/values-ci.yaml
          helm template ci deploy/helm/telemetry -f deploy/helm/telemetry/values-ci.yaml > "$RUNNER_TEMP/telemetry.yaml"
          kubeconform -strict -summary "$RUNNER_TEMP/telemetry.yaml" deploy/kind/dependencies.yaml deploy/kubernetes/storageclass-aws.yaml
          python3 scripts/check-production-chart.py
      - name: Verify AWS policy without credentials or resource creation
        run: |
          terraform -chdir=infra/aws fmt -check -recursive
          terraform -chdir=infra/aws init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws test
  kubernetes-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [contracts-and-integration, deployment-contracts, console-contracts]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install checksum-verified Kubernetes tools
        run: |
          python3 scripts/install-tools.py --directory "$RUNNER_TEMP/telemetry-tools" helm kind
          echo "$RUNNER_TEMP/telemetry-tools" >> "$GITHUB_PATH"
      - name: Install locked browser test dependencies
        run: |
          npm ci --prefix console --ignore-scripts --no-fund --no-audit
          ./console/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify the isolated Compose runtime
        run: ./scripts/compose-smoke.sh
      - name: Build, deploy, reconcile HTTP202 IDs and roll collector
        run: ./scripts/kind-smoke.sh
      - name: Collect synthetic deployment reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deployment-smoke
          path: |
            data/kind-smoke/
            data/compose-smoke/
          if-no-files-found: error
