{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "telemetry.name" . }}}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: telemetry}
  policyTypes: [Ingress, Egress]
  {{- if .Values.networkPolicy.ingressPeers }}
  ingress:
    - from: {{ toYaml .Values.networkPolicy.ingressPeers | nindent 8 }}
      ports: [{protocol: TCP, port: 8080}]
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- with .Values.networkPolicy.egress }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
