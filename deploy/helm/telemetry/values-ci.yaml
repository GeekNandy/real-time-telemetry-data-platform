production: false
image: real-time-telemetry-data-platform:ci
collector: {replicas: 1, storageClass: standard, volumeSize: 1Gi}
worker: {replicas: 2}
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: '1', memory: 768Mi}
runtime:
  kafkaBootstrapServers: kafka.telemetry-deps:9092
  schemaRegistryUrl: http://registry.telemetry-deps:8081
  issuer: http://localhost:8080
  kafkaSecurityProtocol: PLAINTEXT
networkPolicy:
  enabled: true
  ingressPeers:
    - namespaceSelector: {matchLabels: {purpose: telemetry-client}}
      podSelector: {matchLabels: {access: allowed}}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: telemetry-deps}}
          podSelector: {matchExpressions: [{key: app, operator: In, values: [kafka, registry, postgres]}]}
      ports: [{protocol: TCP, port: 9092}, {protocol: TCP, port: 8081}, {protocol: TCP, port: 5432}]
