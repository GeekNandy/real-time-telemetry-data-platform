global:
  scrape_interval: 10s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: telemetry
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /etc/prometheus/auth/observe.token
    static_configs:
      - targets: [collector:8080]
        labels: {component: collector}
      - targets: [worker:8082]
        labels: {component: worker}
