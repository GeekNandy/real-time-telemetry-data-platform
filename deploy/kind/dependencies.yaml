# Single-node development dependencies for CI only. Production uses external HA services.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka}
spec:
  serviceName: kafka
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          ports: [{containerPort: 9092}]
          env:
            - {name: KAFKA_NODE_ID, value: '1'}
            - {name: KAFKA_PROCESS_ROLES, value: 'broker,controller'}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@kafka:9093'}
            - {name: KAFKA_LISTENERS, value: 'PLAINTEXT://:9092,CONTROLLER://:9093'}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: 'PLAINTEXT://kafka:9092'}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '1'}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: '-Xms256m -Xmx512m'}
          readinessProbe:
            exec: {command: [/opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:9092, --list]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts: [{name: log, mountPath: /var/lib/kafka/data}]
  volumeClaimTemplates:
    - metadata: {name: log}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: kafka}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: kafka}
  ports: [{port: 9092}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry}
spec:
  replicas: 1
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
        - name: registry
          image: confluentinc/cp-schema-registry:8.2.0
          ports: [{containerPort: 8081}]
          env:
            - {name: SCHEMA_REGISTRY_HOST_NAME, value: registry}
            - {name: SCHEMA_REGISTRY_LISTENERS, value: 'http://0.0.0.0:8081'}
            - {name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: 'PLAINTEXT://kafka:9092'}
            - {name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR, value: '1'}
            - {name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL, value: FULL_TRANSITIVE}
            - {name: SCHEMA_REGISTRY_HEAP_OPTS, value: '-Xms128m -Xmx512m'}
          readinessProbe:
            httpGet: {path: /subjects, port: 8081}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: registry}
spec:
  selector: {app: registry}
  ports: [{port: 8081}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: telemetry}
            - {name: POSTGRES_USER, value: telemetry}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: telemetry-runtime, key: database-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: [pg_isready, -U, telemetry, -d, telemetry]}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432}]
