upstream telemetry_collector { server collector:8080; }
upstream telemetry_worker { server worker:8082; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 16k;
    client_body_timeout 5s;
    keepalive_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    location = /api/collector/events {
        limit_except POST { deny all; }
        proxy_pass http://telemetry_collector/v1/events;
    }
    location ~ "^/api/worker/events/(?<event_id>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$" {
        limit_except GET { deny all; }
        proxy_pass http://telemetry_worker/v1/events/$event_id;
    }
    location = /api/collector/metrics {
        limit_except GET { deny all; }
        proxy_pass http://telemetry_collector/v1/operations/metrics;
    }
    location = /api/worker/metrics {
        limit_except GET { deny all; }
        proxy_pass http://telemetry_worker/v1/operations/metrics;
    }
    location = /api/collector/readiness {
        limit_except GET { deny all; }
        proxy_pass http://telemetry_collector/actuator/health/readiness;
    }
    location = /api/worker/readiness {
        limit_except GET { deny all; }
        proxy_pass http://telemetry_worker/actuator/health/readiness;
    }
    location /api/ { return 404; }
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }
    location = / {
        limit_except GET { deny all; }
        try_files /index.html =404;
    }
    location / {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
}
