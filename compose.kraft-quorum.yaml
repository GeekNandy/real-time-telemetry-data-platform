# Optional six-node reference. Apply AFTER compose.yaml and compose.replicated.yaml.
# Start with a fresh Compose project and volumes. This is a single-host failure simulation,
# NOT a migration procedure or proof of multi-AZ availability.
x-kraft-voters: &kraft-voters 101@kafka-controller-1:9093,102@kafka-controller-2:9093,103@kafka-controller-3:9093
x-kraft-controller-environment: &controller-environment
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: *kraft-voters
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
x-kraft-controller: &controller
  image: apache/kafka:4.0.0
  cpus: 0.5
  mem_limit: 512m
  healthcheck:
    test: [CMD-SHELL, "/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-controller localhost:9093 describe --status >/dev/null 2>&1"]
    interval: 10s
    timeout: 8s
    retries: 24
    start_period: 20s
services:
  kafka-controller-1:
    <<: *controller
    hostname: kafka-controller-1
    environment:
      <<: *controller-environment
      KAFKA_NODE_ID: 101
    volumes: [kraft-controller-1-data:/var/lib/kafka/data]
  kafka-controller-2:
    <<: *controller
    hostname: kafka-controller-2
    environment:
      <<: *controller-environment
      KAFKA_NODE_ID: 102
    volumes: [kraft-controller-2-data:/var/lib/kafka/data]
  kafka-controller-3:
    <<: *controller
    hostname: kafka-controller-3
    environment:
      <<: *controller-environment
      KAFKA_NODE_ID: 103
    volumes: [kraft-controller-3-data:/var/lib/kafka/data]
  kafka:
    # The original combined node becomes a broker. Keep its Kafka data volume,
    # listeners and advertised endpoints from compose.yaml.
    environment:
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: *kraft-voters
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094
    depends_on:
      kafka-controller-1: {condition: service_started}
      kafka-controller-2: {condition: service_started}
      kafka-controller-3: {condition: service_started}
  kafka2:
    environment:
      KAFKA_CONTROLLER_QUORUM_VOTERS: *kraft-voters
    depends_on:
      kafka-controller-1: {condition: service_started}
      kafka-controller-2: {condition: service_started}
      kafka-controller-3: {condition: service_started}
  kafka3:
    environment:
      KAFKA_CONTROLLER_QUORUM_VOTERS: *kraft-voters
    depends_on:
      kafka-controller-1: {condition: service_started}
      kafka-controller-2: {condition: service_started}
      kafka-controller-3: {condition: service_started}
volumes:
  kraft-controller-1-data:
  kraft-controller-2-data:
  kraft-controller-3-data:
