name: real-time-telemetry
x-platform: &platform
  image: real-time-telemetry-data-platform:local
  build: .
  init: true
  read_only: true
  tmpfs: [/tmp:size=64m,mode=1777]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 35s
  mem_limit: 768m
  cpus: 1.0
x-platform-env: &platform-env
  SERVER_ADDRESS: 0.0.0.0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SCHEMA_REGISTRY_URL: http://registry:8081
  SCHEMA_REGISTRATION_ALLOWED: "true"
  JWT_MODE: demo
  JWT_ISSUER: http://localhost:8080
  DEMO_JWT_SECRET: ${DEMO_JWT_SECRET:?Run scripts/dev-up.sh first}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:ActiveProcessorCount=1
services:
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports: ["127.0.0.1:9092:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
  registry:
    image: confluentinc/cp-schema-registry:8.2.0
    environment:
      SCHEMA_REGISTRY_HOST_NAME: registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: FULL_TRANSITIVE
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx512m
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/dev-up.sh first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16686:16686"]
    mem_limit: 512m
  collector:
    <<: *platform
    environment:
      <<: *platform-env
      SPRING_PROFILES_ACTIVE: collector
      BUFFER_PATH: /app/data/wal
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - collector-wal:/app/data/wal
      - profiles:/profiles
    depends_on:
      registry: {condition: service_healthy}
      jaeger: {condition: service_started}
  worker:
    <<: *platform
    environment:
      <<: *platform-env
      SPRING_PROFILES_ACTIVE: worker
      DATABASE_URL: jdbc:postgresql://postgres:5432/telemetry?connectTimeout=2&socketTimeout=5&options=-c%20statement_timeout=3000
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    ports: ["127.0.0.1:8082:8082"]
    volumes: [profiles:/profiles]
    depends_on:
      registry: {condition: service_healthy}
      postgres: {condition: service_healthy}
      jaeger: {condition: service_started}
  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [observability]
    command: [--config.file=/etc/prometheus/prometheus.yaml, --storage.tsdb.retention.time=2d]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - ./data/auth:/etc/prometheus/auth:ro
volumes:
  kafka-data:
  postgres-data:
  collector-wal:
  profiles:
